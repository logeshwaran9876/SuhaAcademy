apiVersion: apps/v1
kind: Deployment
metadata:
  name: suha-frontend
  namespace: suha
  labels:
    app: suha-frontend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: suha-frontend

  template:
    metadata:
      labels:
        app: suha-frontend

    spec:
      containers:
        - name: suha-frontend

          image: YOUR_REGISTRY/suha-frontend:latest

          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 80

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "256Mi"

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20