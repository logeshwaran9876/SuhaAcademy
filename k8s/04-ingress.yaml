apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: suha-frontend-ingress
  namespace: suha

spec:
  ingressClassName: nginx

  rules:
    - host: suha.example.com

      http:
        paths:
          - path: /
            pathType: Prefix

            backend:
              service:
                name: suha-frontend-service
                port:
                  number: 80